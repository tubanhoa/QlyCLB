<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quản lý thành viên - Hệ thống Quản lý Câu lạc bộ Sinh viên">
    <title>Thành viên | CLB Manager</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
                    <h1 class="page-title"><span class="emoji">👥</span> Quản lý Thành viên</h1>
                </div>
            </header>

            <div class="page-content">
                <div class="table-container">
                    <div class="table-header">
                        <h3>Danh sách thành viên</h3>
                        <div class="table-actions">
                            <div class="search-box">
                                <span class="search-icon">🔍</span>
                                <input type="text" class="form-control" id="searchInput" placeholder="Tìm kiếm...">
                            </div>
                            <select class="form-control" id="filterDept" style="width: auto; min-width: 160px;">
                                <option value="">Tất cả ban</option>
                            </select>
                            <button class="btn btn-primary admin-only" onclick="openAddModal()">➕ Thêm thành viên</button>
                        </div>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Họ tên</th>
                                    <th>Email</th>
                                    <th>Điện thoại</th>
                                    <th>Ban</th>
                                    <th>Kỹ năng</th>
                                    <th>Trạng thái</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="membersTable">
                                <tr><td colspan="8" class="empty-state"><p>Đang tải...</p></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Thêm/Sửa -->
    <div class="modal-overlay" id="memberModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Thêm thành viên</h3>
                <button class="modal-close" onclick="closeModal('memberModal')">✕</button>
            </div>
            <div class="modal-body">
                <form id="memberForm">
                    <input type="hidden" id="editId">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Họ tên *</label>
                            <input type="text" class="form-control" id="memberName" required>
                        </div>
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" class="form-control" id="memberEmail" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Số điện thoại</label>
                            <input type="text" class="form-control" id="memberPhone">
                        </div>
                        <div class="form-group">
                            <label>Ban chuyên môn</label>
                            <select class="form-control" id="memberDept">
                                <option value="">-- Chọn ban --</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Kỹ năng</label>
                        <input type="text" class="form-control" id="memberSkills" placeholder="VD: Python, Thiết kế, Giao tiếp">
                    </div>
                    <div class="form-group">
                        <label>Lịch rảnh</label>
                        <input type="text" class="form-control" id="memberAvailability" placeholder="VD: Thứ 2-4: 14h-17h">
                    </div>
                    <div class="form-group">
                        <label>Trạng thái</label>
                        <select class="form-control" id="memberStatus">
                            <option value="active">Hoạt động</option>
                            <option value="inactive">Ngừng hoạt động</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('memberModal')">Hủy</button>
                <button class="btn btn-primary" onclick="saveMember()">💾 Lưu</button>
            </div>
        </div>
    </div>

    <!-- Modal Chi tiết -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3>📋 Chi tiết thành viên</h3>
                <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
            </div>
            <div class="modal-body" id="detailContent"></div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/members.js"></script>
</body>
</html>
